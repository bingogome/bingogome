<svg xmlns="http://www.w3.org/2000/svg" width="79" height="20" role="img" aria-label="LeRobot">
  <title>LeRobot</title>
  <!-- Official tag icon from https://huggingface.co/spaces/lerobot/LeRobot-branding -->
  <defs>
    <filter id="monochrome" color-interpolation-filters="sRGB">
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncR type="linear" slope="0.65" intercept="0.35"/>
        <feFuncG type="linear" slope="0.65" intercept="0.35"/>
        <feFuncB type="linear" slope="0.65" intercept="0.35"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="79" height="20" fill="#111111"/>
  <image x="4" y="2" width="16" height="16" filter="url(#monochrome)" href="data:image/svg+xml;base64,"/>
  <text x="49" y="14" fill="#ffffff" text-anchor="middle" font-family="Verdana, Geneva, DejaVu Sans, sans-serif" font-size="10">LEROBOT</text>
</svg>
