<svg xmlns="http://www.w3.org/2000/svg" width="58" height="20" role="img" aria-label="Pixi">
  <title>Pixi</title>
  <!-- Official Pixi logo from https://github.com/prefix-dev/pixi -->
  <defs>
    <filter id="monochrome" color-interpolation-filters="sRGB">
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncR type="linear" slope="0.5" intercept="0.5"/>
        <feFuncG type="linear" slope="0.5" intercept="0.5"/>
        <feFuncB type="linear" slope="0.5" intercept="0.5"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="58" height="20" fill="#111111"/>
  <image x="4" y="2" width="16" height="16" filter="url(#monochrome)" href="data:image/svg+xml;base64,"/>
  <text x="40" y="14" fill="#ffffff" text-anchor="middle" font-family="Verdana, Geneva, DejaVu Sans, sans-serif" font-size="10">PIXI</text>
</svg>
