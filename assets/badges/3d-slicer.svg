<svg xmlns="http://www.w3.org/2000/svg" width="90" height="20" role="img" aria-label="3D Slicer">
  <title>3D Slicer</title>
  <!-- Official low-resolution mark, rendered in monochrome, from https://www.slicer.org/wiki/Slicer3:Slicer3Brand -->
  <defs>
    <filter id="monochrome" color-interpolation-filters="sRGB">
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="90" height="20" fill="#57606A"/>
  <image
    x="4"
    y="2"
    width="16"
    height="16"
    filter="url(#monochrome)"
    href="data:image/png;base64,"
  />
  <text
    x="57"
    y="14"
    fill="#ffffff"
    text-anchor="middle"
    font-family="Verdana, Geneva, DejaVu Sans, sans-serif"
    font-size="10"
  >3D SLICER</text>
</svg>
