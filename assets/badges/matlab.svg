<svg xmlns="http://www.w3.org/2000/svg" width="75" height="20" role="img" aria-label="MATLAB">
  <title>MATLAB</title>
  <!-- MATLAB glyph from Devicon: https://github.com/devicons/devicon -->
  <defs>
    <filter id="monochrome" color-interpolation-filters="sRGB">
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncR type="linear" slope="0.6" intercept="0.4"/>
        <feFuncG type="linear" slope="0.6" intercept="0.4"/>
        <feFuncB type="linear" slope="0.6" intercept="0.4"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="75" height="20" fill="#57606A"/>
  <image x="4" y="2" width="16" height="16" filter="url(#monochrome)" href="data:image/svg+xml;base64,"/>
  <text x="48" y="14" fill="#ffffff" text-anchor="middle" font-family="Verdana, Geneva, DejaVu Sans, sans-serif" font-size="10">MATLAB</text>
</svg>
